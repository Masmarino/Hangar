<div class="container">
  @if (loading()) {
    <p>Chargement…</p>
  } @else {
    @if (summaryChartData().length > 0) {
      <gbt-card heading="Résumé" icon="history">
        <gbt-dimension-card
          [rows]="summaryChartData()"
          caption="Entrées par type"
          labelColumn="Type"
          valueColumn="Entrées"
          emptyMessage="Aucune entrée."
          [locale]="locale"
        />
      </gbt-card>
    }

    <div class="d-flex justify-content-end mb-3">
      <gbt-button
        text="Télécharger en CSV"
        [disabled]="entries().length === 0"
        (clicked)="downloadCsv()"
      />
    </div>

    <gbt-table
      caption="Journal d'audit"
      emptyMessage="Aucune donnée disponible"
      [data]="entries()"
      [columns]="columns"
      [trackBy]="rowId"
    />
  }
</div>
