<div class="form-container">
  <gbt-card heading="Serveur mail (SMTP)" icon="mail">
    @if (loading()) {
      <p>Chargement…</p>
    } @else {
      <gbt-input
        label="Hôte SMTP"
        [ngModel]="host()"
        (ngModelChange)="host.set($event)"
        [errorMessage]="hostError()"
      />
      <gbt-input
        label="Port"
        [ngModel]="port()"
        (ngModelChange)="port.set($event)"
        [errorMessage]="portError()"
      />
      <gbt-input
        label="Identifiant"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        [errorMessage]="usernameError()"
      />
      <gbt-input
        label="Mot de passe"
        type="password"
        showPasswordLabel="Afficher le mot de passe"
        hidePasswordLabel="Masquer le mot de passe"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [errorMessage]="passwordError()"
        [placeholder]="passwordSet() ? 'Laisser vide pour conserver le mot de passe actuel' : ''"
      />
      <gbt-input
        label="Nom d'expéditeur"
        [ngModel]="fromName()"
        (ngModelChange)="fromName.set($event)"
        [errorMessage]="fromNameError()"
        placeholder="Hangar"
      />
      <gbt-input
        label="Adresse d'expédition"
        [ngModel]="fromAddress()"
        (ngModelChange)="fromAddress.set($event)"
        [errorMessage]="fromAddressError()"
      />
      <gbt-select
        label="Sécurité"
        placeholder="Sélectionner…"
        [options]="securityOptions"
        [ngModel]="security()"
        (ngModelChange)="security.set($event)"
      />

      <gbt-button text="Enregistrer" [loading]="saving()" [disabled]="hasErrors()" (clicked)="save()" loadingLabel="Chargement en cours" />
    }
  </gbt-card>

  @if (!loading()) {
    <gbt-card heading="Envoyer un e-mail de test" icon="send">
      <gbt-input
        label="Destinataire"
        [ngModel]="testRecipient()"
        (ngModelChange)="testRecipient.set($event)"
      />
      <gbt-tooltip text="Utilise la configuration déjà enregistrée, pas les modifications du formulaire ci-dessus.">
        <gbt-button
          text="Envoyer"
          variant="secondary"
          [loading]="sendingTest()"
          loadingLabel="Chargement en cours"
          [disabled]="testRecipient().trim() === ''"
          (clicked)="sendTest()"
        />
      </gbt-tooltip>
    </gbt-card>
  }
</div>
