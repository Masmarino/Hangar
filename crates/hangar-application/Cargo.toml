[package]
name = "hangar-application"
version = "0.1.0"
edition.workspace = true

[dependencies]
hangar-domain = { path = "../hangar-domain" }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
base64 = "0.23.1"
hex = "0.4.3"
serde_json = "1.0.151"
rand = "0.10.2"
semver = "1"
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth", "std"] }
webauthn-rs = "0.5.5"
openssl = { version = "0.10.81", features = ["vendored"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
bytes = "1"
tracing = "0.1"

[dev-dependencies]
hangar-infrastructure = { path = "../hangar-infrastructure" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
