[package]
name = "hangar-domain"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
sha2 = "0.11.0"
hex = "0.4.3"
bytes = "1"
futures-core = "0.3"
