[package]
name = "hangar-docker"
version = "0.1.0"
edition.workspace = true

[dependencies]
hangar-domain = { path = "../hangar-domain" }
hangar-application = { path = "../hangar-application" }
hangar-infrastructure = { path = "../hangar-infrastructure" }
axum = "0.7"
axum-extra = { version = "0.12", features = ["typed-header"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# `axum::extract::Query` (backed by `serde_urlencoded`) does not collect
# repeated query keys into a `Vec` field the way form data with `[]`-style
# keys does — a real `docker`/containerd client sending two `scope=...`
# parameters on one `/v2/token` request (see `routes::handshake::merge_scopes`)
# needs the raw pairs parsed directly instead. Already present transitively
# (via `serde_urlencoded`/`url`) — pinned directly here since this crate now
# calls it itself.
form_urlencoded = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
tempfile = "3"
