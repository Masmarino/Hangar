name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "release/**"
    tags: ["v*.*.*"]
  # No branch filter here — PRs always just build+test; scan/docker build only happen on a direct push.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # keep in sync with rust-toolchain.toml — that's the real source of truth
  RUST_VERSION: "1.98.1"
  NODE_VERSION: "26"
  DOCKER_IMAGE: masmarino/hangar

jobs:
  # ── Build & test ────────────────────────────────────────────────────────

  test-backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Offline mode checks queries against the committed .sqlx cache — but sqlx::test still spins up a real (ephemeral) postgres per test.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-06
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

  test-frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --watch=false

  # ── Security scan: source & dependencies ───────────────────────────────
  # Runs on every PR plus pushes to develop/main/release*/tags. feature/fix branches just get build+test until they open a PR.

  security-scan-source:
    name: Security scan (source & dependencies)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-06
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # Trivy/Grype only flag a vuln once indexed against the crate version — cargo-audit covers the gap by reading the RUSTSEC feed directly.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo audit
        id: cargo-audit
        continue-on-error: true
        # Ignoring RUSTSEC-2023-0071 (Marvin Attack, RSA timing side-channel): comes in via openidconnect, which only calls verify() for ID-token checks — the private-key op the
        # timing attack needs is never exercised. No upstream fix yet; revisit if that changes.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Trivy filesystem scan
        id: trivy-fs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        # This upload can fail on its own (e.g. Advanced Security disabled) — not a reason to fail the job; the explicit check below is what actually gates it.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-source

      - name: Grype source scan
        id: grype-fs
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          only-fixed: true

      - name: Upload Grype SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          sarif_file: ${{ steps.grype-fs.outputs.sarif }}
          category: grype-source

      - name: Fail if HIGH/CRITICAL vulnerabilities were found
        if: steps.trivy-fs.outcome == 'failure' || steps.grype-fs.outcome == 'failure' || steps.cargo-audit.outcome == 'failure'
        run: |
          echo "Trivy, Grype and/or cargo audit found vulnerabilities in source dependencies."
          echo "See the job log (cargo audit) and the Security tab (Trivy/Grype) for details."
          exit 1

  # ── Build, scan & (conditionally) push the Docker image ────────────────
  # Built once, scanned, then pushed as-is (never rebuilt) if it's main or a version tag. release/* just builds+scans as a release-candidate check, never pushed.

  build-and-push:
    name: Build, scan & push Docker image
    runs-on: ubuntu-latest
    needs: security-scan-source
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      security-events: write
    env:
      IS_PUBLISHABLE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (local only — not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        id: trivy-image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Grype image scan
        id: grype-image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          only-fixed: true

      - name: Upload Grype image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          sarif_file: ${{ steps.grype-image.outputs.sarif }}
          category: grype-image

      - name: Fail if the built image has HIGH/CRITICAL vulnerabilities
        if: steps.trivy-image.outcome == 'failure' || steps.grype-image.outcome == 'failure'
        run: |
          echo "Trivy and/or Grype found HIGH/CRITICAL vulnerabilities in the built image."
          echo "See the Security tab for details. Not pushing to Docker Hub."
          exit 1

      - name: Log in to Docker Hub
        if: env.IS_PUBLISHABLE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the scanned image under all its tags
        if: env.IS_PUBLISHABLE == 'true'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # ── Deploy: patch the production Deployment to the just-pushed release image ──
  # Only on a version tag; main/release builds stop at the registry push above.

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Write kubeconfig
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig.yaml"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig.yaml"

      - name: Patch the Deployment image
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig.yaml
          IMAGE: ${{ env.DOCKER_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          kubectl set image "deployment/${{ vars.K8S_DEPLOYMENT }}" \
            "${{ vars.K8S_CONTAINER }}=$IMAGE" \
            -n "${{ vars.K8S_NAMESPACE }}"
          kubectl rollout status "deployment/${{ vars.K8S_DEPLOYMENT }}" \
            -n "${{ vars.K8S_NAMESPACE }}" --timeout=5m
